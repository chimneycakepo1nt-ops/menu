const hex_rgb = h => { const v = parseInt(h.slice(1), 16); return [v >> 16, v >> 8 & 255, v & 255]; };
const shade = (h, k) => {
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${hex_rgb(h).map(f).join(",")})`;
};
const rgba = (h, a) => `rgba(${hex_rgb(h).join(",")},${a})`;

function dots(c, x0, y0, w, h, count) {
  let s = "";
  for (let i = 0; i < count; i++) {
    const x = x0 + (i * 37 % w);
    const y = y0 + (i * 53 % h);
    s += `<circle cx="${x}" cy="${y}" r="1.3" fill="${shade(c, i % 2 ? .4 : -.35)}"/>`;
  }
  return s;
}

function spiral(x1, x2, y0, y1, color) {
  let s = "";
  for (let y = y0; y < y1; y += 11) s += `<path d="M${x1} ${y + 8} Q50 ${y + 2} ${x2} ${y - 2}" stroke="${color}" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>`;
  return s;
}

  ? `<img class="photo" src="${it.img}" alt="" loading="lazy">`
  : art(cat_of(it.cat).kind, color_of(it), it.f || it.c);

const ready = codes.filter(c => ui.hint[c]);
const native = c => langs.find(x => x[0] === c)[1];

function match_tag(t) {
  t = t.toLowerCase();
  const base = t.split("-")[0];
  if (base === "zh") return /hant|-tw|-hk|-mo/.test(t) ? "zh-Hant" : "zh";
  const alias = { nb: "no", nn: "no", fil: "tl", iw: "he", in: "id" };
  if (alias[base]) return alias[base];
  if (t === "sr-me" || t.startsWith("sr-latn-me")) return "cnr";
  return codes.find(c => c.toLowerCase() === t) || codes.find(c => c.toLowerCase() === base) || null;
}

function pick_lang() {
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  if (saved && ready.includes(saved)) return saved;
  for (const t of navigator.languages || [navigator.language || "en"]) {
    const c = match_tag(t);
    if (c && ready.includes(c)) return c;
  }
  return "en";
}

function set_lang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  render();
}

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = rtl.includes(lang) ? "rtl" : "ltr";
  document.getElementById("lang-name").textContent = native(lang);
  document.getElementById("tagline").textContent = ui.tagline[lang];
  document.getElementById("chips").innerHTML = cats.map(c => `<button class="chip" data-go="${c.id}">${c.title[lang]}</button>`).join("");
  let html = `<div class="hint"><div class="num"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg></div><p>${ui.hint[lang]}</p></div>`;
  for (const c of cats) {
    const list = items.filter(i => i.cat === c.id);
    html += `<section id="s-${c.id}"><h2>${c.title[lang]}</h2>${c.desc ? `<p class="desc">${c.desc[lang]}</p>` : `<p class="desc"></p>`}`;
    if (c.id === "extra") {
      html += `<div class="extras">${list.map(it => `<button class="row" data-n="${it.n}"><span class="art" style="${tint(it)}">${visual(it)}</span><span class="name"><bdi>${name_of(it, lang)}</bdi></span><span class="price">${fmt(it.price, "+")}</span></button>`).join("")}</div>`;
    } else {
      html += `<div class="grid">${list.map(it => `<button class="card" data-n="${it.n}"><span class="art" style="${tint(it)}">${visual(it)}</span><span class="info"><span class="name"><bdi>${name_of(it, lang)}</bdi></span>${it.ing ? `<span class="sub">${sub_of(it, lang)}</span>` : ""}<span class="price">${fmt(it.price)}</span></span></button>`).join("")}</div>`;
    }
    html += `</section>`;
  }
  html += `<footer class="foot"><p>${ui.allergens[lang]}</p><p><a href="mailto:${contact}">${ui.mistake[lang]}</a></p><p class="sign">CHIMNEY CAKE POINT</p></footer>`;
  document.getElementById("menu").innerHTML = html;
  watch_sections();
}

const sheet = document.getElementById("sheet");
const veil = document.getElementById("veil");
let sheet_body;
const x_icon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const is_open = () => sheet.classList.contains("open");

function open_sheet(html) {
  sheet.innerHTML = `<div class="head"><div class="grip"></div><button class="x" data-close aria-label="${ui.close[lang]}">${x_icon}</button></div><div class="body">${html}<button class="close" data-close>${ui.close[lang]}</button></div>`;
  sheet_body = sheet.querySelector(".body");
  sheet_body.scrollTop = 0;
  sheet.style.transform = "";
  if (!is_open()) {
    try { history.pushState({ sheet: 1 }, ""); } catch (e) {}
  }
  sheet.classList.add("open");
  veil.classList.add("open");
  document.body.classList.add("locked");
}

function hide_sheet() {
  sheet.classList.remove("open", "drag");
  sheet.style.transform = "";
  veil.style.opacity = "";
  veil.classList.remove("open");
  document.body.classList.remove("locked");
  const f = document.activeElement;
  if (f && f.blur) f.blur();
}

function close_sheet() {
  if (!is_open()) return;
  hide_sheet();
  if (history.state && history.state.sheet) history.back();
}

window.addEventListener("popstate", () => { if (is_open()) hide_sheet(); });

let drag = null;
sheet.addEventListener("touchstart", e => {
  if (!is_open() || e.touches.length > 1) return;
  const in_head = !!e.target.closest(".head");
  drag = { y0: e.touches[0].clientY, t0: Date.now(), dy: 0, on: false, dead: false, head: in_head };
}, { passive: true });

sheet.addEventListener("touchmove", e => {
  if (!drag || drag.dead) return;
  const dy = e.touches[0].clientY - drag.y0;
  if (!drag.on) {
    if (Math.abs(dy) < 6) return;
    const at_top = !sheet_body || sheet_body.scrollTop <= 0;
    if (dy > 0 && (drag.head || at_top)) {
      drag.on = true;
      drag.t0 = Date.now();
      drag.y0 = e.touches[0].clientY;
      sheet.classList.add("drag");
      const f = document.activeElement;
      if (f && f.id === "find") f.blur();
    } else { drag.dead = true; return; }
  }
  if (e.cancelable) e.preventDefault();
  drag.dy = Math.max(0, e.touches[0].clientY - drag.y0);
  sheet.style.transform = `translateY(${drag.dy}px)`;
  veil.style.opacity = String(Math.max(0, 1 - drag.dy / (sheet.offsetHeight || 1)));
}, { passive: false });

const end_drag = () => {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (!d.on) return;
  sheet.classList.remove("drag");
  const fast = d.dy > 30 && d.dy / Math.max(1, Date.now() - d.t0) > .5;
  if (d.dy > Math.min(140, sheet.offsetHeight * .25) || fast) close_sheet();
  else { sheet.style.transform = ""; veil.style.opacity = ""; }
};
sheet.addEventListener("touchend", end_drag);
sheet.addEventListener("touchcancel", end_drag);
veil.addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

function show_item(n) {
  const it = items.find(i => i.n === n);
  const c = cat_of(it.cat);
  open_sheet(`<div class="big" style="${tint(it)}">${visual(it)}</div>
    <div class="say"><p>${ui.say[lang]}</p><div class="n">${board(it)}</div><small>${c.board}</small></div>
    <h3><bdi>${name_of(it, lang)}</bdi></h3>
    <div class="sub">${c.title[lang]}${it.ing ? " · " + sub_of(it, lang) : ""}</div>
    <div class="price">${fmt(it.price, it.cat === "extra" ? "+" : "")}</div>`);
}

function show_langs() {
  const sorted = [lang, ...ready.filter(c => c !== lang).sort((a, b) => native(a).localeCompare(native(b)))];
  const btn = c => `<button data-lang="${c}" class="${c === lang ? "on" : ""}">${native(c)}</button>`;
  open_sheet(`<h4>${ui.choose[lang]}</h4>
    <div class="quick">${quick.filter(c => ready.includes(c)).map(btn).join("")}</div>
    <input class="find" id="find" type="search" autocomplete="off" placeholder="${ui.search[lang]}">
    <div class="langs" id="lang-list">${sorted.map(btn).join("")}</div>
    <p class="empty" id="lang-empty" hidden>${ui.nothing[lang]}</p>`);
}

function filter_langs(q) {
  q = q.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("#lang-list [data-lang]").forEach(b => {
    const l = langs.find(x => x[0] === b.dataset.lang);
    const ok = !q || l.some(v => v.toLowerCase().includes(q));
    b.hidden = !ok;
    if (ok) shown++;
  });
  document.getElementById("lang-empty").hidden = shown > 0;
}

let observer;
function watch_sections() {
  if (observer) observer.disconnect();
  if (!("IntersectionObserver" in window)) return;
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const id = e.target.id.slice(2);
      document.querySelectorAll(".chip").forEach(ch => {
        const on = ch.dataset.go === id;
        ch.classList.toggle("on", on);
        if (on) ch.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      });
    });
  }, { rootMargin: "-120px 0px -65% 0px" });
  document.querySelectorAll("section").forEach(s => observer.observe(s));
}

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { document.getElementById("s-" + go.dataset.go).scrollIntoView({ behavior: "smooth" }); return; }
  const card = e.target.closest("[data-n]");
  if (card) { show_item(Number(card.dataset.n)); return; }
  const l = e.target.closest("[data-lang]");
  if (l) { const c = l.dataset.lang; close_sheet(); if (c !== lang) set_lang(c); return; }
  if (e.target.closest("[data-close]") || e.target === veil) close_sheet();
  if (e.target.closest("#lang-btn")) show_langs();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") close_sheet(); });
document.addEventListener("input", e => { if (e.target.id === "find") filter_langs(e.target.value); });

lang = pick_lang();
render();
</script>
</body>
</html>
